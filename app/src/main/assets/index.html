<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Ultimate Advanced Web-based eBook Reader - Read EPUB, PDF, Markdown, TXT, HTML, CBZ, FB2 offline">
    <title>📚 Ultimate eBook Reader</title>

    <!-- ==================== External CDN Libraries ==================== -->
    <!-- epub.js for EPUB rendering -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <!-- pdf.js for PDF rendering -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <!-- marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <!-- localforage for IndexedDB abstraction -->
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <!-- JSZip for CBZ comic book format -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <!-- OpenDyslexic font via CDN -->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/open-dyslexic" media="print" onload="this.media='all'">

    <style>
        /* ==================== CSS CUSTOM PROPERTIES (THEME SYSTEM) ==================== */
        :root {
            /* Light Theme (default) */
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8eaef;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-tertiary: #6b6b80;
            --accent: #6366f1;
            --accent-hover: #5558e6;
            --accent-light: #eef0ff;
            --border: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --card-bg: #ffffff;
            --card-hover: #f8f9fc;
            --progress-bg: #e0e3eb;
            --progress-fill: #6366f1;
            --overlay: rgba(0, 0, 0, 0.5);
            --highlight-yellow: rgba(255, 230, 100, 0.5);
            --highlight-blue: rgba(100, 180, 255, 0.5);
            --highlight-green: rgba(100, 255, 150, 0.5);
            --highlight-pink: rgba(255, 150, 200, 0.5);
            --reader-bg: #fafbfc;
            --sidebar-bg: #ffffff;
            --input-bg: #f5f6f8;
            --toast-bg: #1a1a2e;
            --toast-text: #ffffff;
            --scrollbar-thumb: #c4c8d4;
            --scrollbar-track: transparent;
            --tts-highlight: rgba(99, 102, 241, 0.3);
            --transition-speed: 0.3s;
        }

        /* Dark Theme */
        [data-theme="dark"] {
            --bg-primary: #1a1b2e;
            --bg-secondary: #222338;
            --bg-tertiary: #2a2c44;
            --text-primary: #e8e9f0;
            --text-secondary: #b8b9cc;
            --text-tertiary: #8b8ca0;
            --accent: #818cf8;
            --accent-hover: #9399ff;
            --accent-light: #1e2040;
            --border: rgba(255, 255, 255, 0.06);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(34, 35, 56, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --card-bg: #222338;
            --card-hover: #2a2c44;
            --progress-bg: #353752;
            --progress-fill: #818cf8;
            --overlay: rgba(0, 0, 0, 0.7);
            --reader-bg: #1a1b2e;
            --sidebar-bg: #222338;
            --input-bg: #2a2c44;
            --toast-bg: #e8e9f0;
            --toast-text: #1a1b2e;
            --scrollbar-thumb: #454768;
            --tts-highlight: rgba(129, 140, 248, 0.35);
        }

        /* Sepia Theme */
        [data-theme="sepia"] {
            --bg-primary: #f4ecd8;
            --bg-secondary: #faf3e4;
            --bg-tertiary: #ebe0c8;
            --text-primary: #4a3828;
            --text-secondary: #6b5540;
            --text-tertiary: #8b7560;
            --accent: #b8860b;
            --accent-hover: #9a6f08;
            --accent-light: #fdf3d0;
            --border: rgba(139, 117, 96, 0.2);
            --shadow-sm: 0 1px 3px rgba(74, 56, 40, 0.08);
            --shadow-md: 0 4px 16px rgba(74, 56, 40, 0.1);
            --shadow-lg: 0 12px 40px rgba(74, 56, 40, 0.15);
            --glass-bg: rgba(250, 243, 228, 0.75);
            --glass-border: rgba(200, 180, 150, 0.4);
            --glass-shadow: 0 8px 32px rgba(74, 56, 40, 0.1);
            --card-bg: #faf3e4;
            --card-hover: #f5ebd5;
            --progress-bg: #e0d5be;
            --progress-fill: #b8860b;
            --reader-bg: #faf3e4;
            --sidebar-bg: #faf3e4;
            --input-bg: #f0e8d5;
            --toast-bg: #4a3828;
            --toast-text: #faf3e4;
            --scrollbar-thumb: #c4b896;
            --tts-highlight: rgba(184, 134, 11, 0.3);
        }

        /* AMOLED Black Theme */
        [data-theme="amoled"] {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #141414;
            --text-primary: #f0f0f0;
            --text-secondary: #b0b0b0;
            --text-tertiary: #707070;
            --accent: #bb86fc;
            --accent-hover: #cf9fff;
            --accent-light: #1a1028;
            --border: rgba(255, 255, 255, 0.04);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.6);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.7);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.8);
            --glass-bg: rgba(10, 10, 10, 0.8);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --card-bg: #0a0a0a;
            --card-hover: #141414;
            --progress-bg: #1e1e1e;
            --progress-fill: #bb86fc;
            --reader-bg: #000000;
            --sidebar-bg: #0a0a0a;
            --input-bg: #141414;
            --toast-bg: #f0f0f0;
            --toast-text: #000000;
            --scrollbar-thumb: #333;
            --tts-highlight: rgba(187, 134, 252, 0.4);
        }

        /* ==================== GLOBAL RESET & BASE STYLES ==================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        /* ==================== APP SHELL ==================== */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 100vw;
            position: relative;
            overflow: hidden;
        }

        /* ==================== TOP NAVIGATION BAR ==================== */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            gap: 0.8rem;
            flex-shrink: 0;
            transition: all var(--transition-speed) ease;
            min-height: 52px;
        }
        .top-nav .nav-title {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .top-nav .nav-actions {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
            align-items: center;
        }

        /* ==================== BUTTON STYLES ==================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0.5rem 0.85rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s ease;
            font-family: inherit;
            text-decoration: none;
            min-height: 36px;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }
        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .btn-icon {
            padding: 0.45rem;
            min-width: 36px;
            width: 36px;
            border-radius: 50%;
            font-size: 1.1rem;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 600;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
        }
        .btn-sm {
            padding: 0.35rem 0.6rem;
            font-size: 0.75rem;
            min-height: 28px;
            border-radius: 8px;
        }
        .btn-ghost {
            background: transparent;
            border-color: transparent;
            color: var(--text-secondary);
        }
        .btn-ghost:hover {
            background: var(--bg-tertiary);
            border-color: transparent;
            box-shadow: none;
        }

        /* ==================== BOOKSHELF VIEW ==================== */
        #bookshelf-view {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            transition: opacity 0.3s ease;
        }
        #bookshelf-view.hidden {
            display: none;
        }
        .bookshelf-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            justify-content: space-between;
        }
        .bookshelf-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .sort-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }
        .sort-btn {
            padding: 0.4rem 0.75rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .sort-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .sort-btn:hover:not(.active) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
        }
        @media (min-width: 768px) {
            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 1.2rem;
            }
        }
        @media (min-width: 1200px) {
            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1.4rem;
            }
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }
        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }
        .book-card:active {
            transform: scale(0.97);
        }
        .book-cover {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--text-tertiary);
            position: relative;
            overflow: hidden;
        }
        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .book-cover .placeholder-icon {
            opacity: 0.5;
            font-size: 3.5rem;
        }
        .book-info {
            padding: 0.7rem 0.8rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .book-title {
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-primary);
        }
        .book-author {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .book-format-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.2rem 0.45rem;
            border-radius: 6px;
            background: var(--accent-light);
            color: var(--accent);
            align-self: flex-start;
        }
        .progress-bar-wrap {
            height: 4px;
            background: var(--progress-bg);
            border-radius: 2px;
            margin-top: 0.3rem;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--progress-fill);
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .progress-label {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            font-weight: 500;
        }
        .book-card-actions {
            position: absolute;
            top: 0.4rem;
            right: 0.4rem;
            display: flex;
            gap: 0.3rem;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 5;
        }
        .book-card:hover .book-card-actions {
            opacity: 1;
        }
        .book-card-actions .btn-icon {
            width: 28px;
            height: 28px;
            min-width: 28px;
            font-size: 0.75rem;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            padding: 0;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem 1.5rem;
            gap: 1rem;
            color: var(--text-tertiary);
        }
        .empty-state .empty-icon {
            font-size: 5rem;
            opacity: 0.6;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 0.9rem;
            max-width: 400px;
        }

        /* ==================== READER VIEW ==================== */
        #reader-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: opacity 0.3s ease;
            background: var(--reader-bg);
        }
        #reader-view.hidden {
            display: none;
        }
        .reader-toolbar {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 0.8rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
            z-index: 90;
            transition: transform 0.3s ease, opacity 0.3s ease;
            min-height: 44px;
        }
        .reader-toolbar.immersive-hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }
        .reader-content {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }
        #epub-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #epub-container.epub-scroll {
            overflow-y: auto !important;
        }
        #pdf-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            gap: 0.5rem;
        }
        #pdf-container canvas {
            max-width: 100%;
            height: auto !important;
            border-radius: 4px;
            box-shadow: var(--shadow-md);
        }
        #html-content-area {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 1rem;
            color: var(--text-primary);
            user-select: text;
            -webkit-user-select: text;
            height: 100%;
        }
        #html-content-area h1, #html-content-area h2, #html-content-area h3 {
            margin-top: 1.2em;
            margin-bottom: 0.5em;
        }
        #html-content-area p {
            margin-bottom: 0.8em;
        }
        #html-content-area img {
            max-width: 100%;
            border-radius: 8px;
        }
        #cbz-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.5rem;
            gap: 0.3rem;
        }
        #cbz-container img {
            max-width: 100%;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: var(--shadow-md);
        }

        /* ==================== SIDEBAR ==================== */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            max-width: 85vw;
            height: 100%;
            height: 100dvh;
            background: var(--sidebar-bg);
            z-index: 210;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .sidebar.active {
            transform: translateX(0);
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar-header h3 {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem;
        }
        .toc-item {
            padding: 0.6rem 0.8rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.15s ease;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-left: 3px solid transparent;
            margin-bottom: 2px;
        }
        .toc-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-left-color: var(--accent);
        }
        .toc-item.active {
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
            border-left-color: var(--accent);
        }
        .settings-group {
            margin-bottom: 1.2rem;
        }
        .settings-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-tertiary);
            margin-bottom: 0.5rem;
        }
        .settings-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.6rem;
        }
        .theme-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .theme-dot:hover {
            transform: scale(1.1);
        }
        .theme-dot.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
        }
        .theme-dot.light { background: #f0f2f5; }
        .theme-dot.dark { background: #1a1b2e; }
        .theme-dot.sepia { background: #f4ecd8; }
        .theme-dot.amoled { background: #000; }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }
        select {
            padding: 0.45rem 0.7rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
        }

        /* ==================== SEARCH BAR ==================== */
        .search-popup {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 0.7rem 1rem;
            z-index: 220;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            transform: translateY(-120%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }
        .search-popup.active {
            transform: translateY(0);
        }
        .search-popup input {
            flex: 1;
            padding: 0.55rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
        }
        .search-results-count {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            white-space: nowrap;
        }

        /* ==================== TOAST NOTIFICATIONS ==================== */
        #toast-container {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: none;
        }
        .toast {
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 0.7rem 1.3rem;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.4s cubic-bezier(0.4, 0, 0.2, 1), toastOut 0.3s ease 1.8s forwards;
            pointer-events: auto;
            white-space: nowrap;
            text-align: center;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-20px); }
        }

        /* ==================== HIGHLIGHT MODAL ==================== */
        .highlight-modal {
            position: fixed;
            background: var(--card-bg);
            border-radius: 14px;
            padding: 0.6rem;
            box-shadow: var(--shadow-lg);
            z-index: 250;
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            border: 1px solid var(--border);
            animation: popIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
        .highlight-color-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .highlight-color-btn:hover {
            border-color: var(--accent);
            transform: scale(1.15);
        }
        .highlight-color-btn.yellow { background: #ffe864; }
        .highlight-color-btn.blue { background: #64b4ff; }
        .highlight-color-btn.green { background: #64ff96; }
        .highlight-color-btn.pink { background: #ff96c8; }

        /* ==================== TTS CONTROLS ==================== */
        .tts-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.8rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
            z-index: 90;
            transition: transform 0.3s ease;
        }
        .tts-bar.immersive-hidden {
            transform: translateY(100%);
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
        }

        /* ==================== RESPONSIVE ADJUSTMENTS ==================== */
        @media (max-width: 600px) {
            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.7rem;
            }
            .book-cover { aspect-ratio: 3/4.5; }
            .book-title { font-size: 0.8rem; }
            .top-nav { padding: 0.5rem 0.7rem; min-height: 44px; }
            .top-nav .nav-title { font-size: 1rem; }
            .btn { font-size: 0.75rem; padding: 0.4rem 0.6rem; min-height: 30px; }
            .reader-toolbar { padding: 0.4rem 0.5rem; gap: 0.2rem; min-height: 38px; }
            .reader-toolbar .btn { font-size: 0.7rem; padding: 0.3rem 0.45rem; min-height: 26px; }
            .sidebar { width: 280px; max-width: 90vw; }
            #html-content-area { padding: 1rem 0.7rem; font-size: 0.9rem; }
        }
        @media (max-width: 380px) {
            .books-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
            .book-cover { aspect-ratio: 3/5; }
            .btn { font-size: 0.7rem; padding: 0.35rem 0.5rem; min-height: 26px; border-radius: 7px; }
            .top-nav .nav-title { font-size: 0.9rem; }
        }

        /* ==================== IMMERSIVE FULLSCREEN ==================== */
        .immersive-mode .top-nav {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 95;
            transition: opacity 0.3s ease;
        }
        .immersive-mode .reader-toolbar {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 94;
            transition: opacity 0.3s ease;
        }
        .immersive-mode .tts-bar {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 94;
            transition: opacity 0.3s ease;
        }
        .immersive-mode .top-nav:hover,
        .immersive-mode .reader-toolbar:hover,
        .immersive-mode .tts-bar:hover {
            opacity: 1;
            pointer-events: auto;
        }

        /* ==================== LOADING SPINNER ==================== */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            z-index: 50;
            opacity: 0.9;
        }
        .hidden { display: none !important; }

        /* ==================== ACCESSIBILITY ==================== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>
    <!-- ==================== APP CONTAINER ==================== -->
    <div id="app-container">
        <!-- Top Navigation -->
        <nav class="top-nav" id="top-nav">
            <span class="nav-title" id="nav-title">📚 My Library</span>
            <div class="nav-actions" id="nav-actions">
                <button class="btn btn-sm" id="btn-back-library" title="Back to Library" style="display:none;">← Library</button>
                <button class="btn btn-sm btn-icon" id="btn-settings" title="Settings & Themes">⚙️</button>
                <button class="btn btn-sm btn-icon" id="btn-toc" title="Table of Contents" style="display:none;">📑</button>
                <button class="btn btn-sm btn-icon" id="btn-search-toggle" title="Search in Book" style="display:none;">🔍</button>
                <button class="btn btn-sm btn-icon" id="btn-immersive" title="Immersive Fullscreen" style="display:none;">⛶</button>
                <label class="btn btn-sm btn-primary" id="btn-upload" title="Add Book">+ Add Book</label>
                <input type="file" id="file-input" accept=".epub,.pdf,.md,.txt,.html,.htm,.cbz,.cbr,.fb2" multiple hidden>
            </div>
        </nav>

        <!-- Bookshelf View -->
        <div id="bookshelf-view">
            <div class="bookshelf-header">
                <h2>📖 Your Bookshelf</h2>
                <div class="sort-filter-row">
                    <span style="font-size:0.78rem;color:var(--text-tertiary);">Sort:</span>
                    <button class="sort-btn active" data-sort="recent">🕐 Recent</button>
                    <button class="sort-btn" data-sort="lastRead">📖 Last Read</button>
                    <button class="sort-btn" data-sort="title">🔤 Title</button>
                </div>
            </div>
            <div class="books-grid" id="books-grid">
                <!-- Dynamically populated -->
            </div>
            <div class="empty-state" id="empty-state">
                <span class="empty-icon">📚</span>
                <h3>Your library is empty</h3>
                <p>Tap <strong>+ Add Book</strong> to upload EPUB, PDF, Markdown, TXT, HTML, CBZ, or FB2 files. They'll be stored offline!</p>
                <button class="btn btn-primary" id="btn-empty-upload">+ Add Your First Book</button>
            </div>
            <div style="text-align:center;padding:1rem;" id="storage-info">
                <small style="color:var(--text-tertiary);">📦 Books stored locally via IndexedDB · Works 100% offline</small>
            </div>
        </div>

        <!-- Reader View -->
        <div id="reader-view" class="hidden">
            <div class="reader-toolbar" id="reader-toolbar">
                <button class="btn btn-sm btn-icon" id="btn-reader-back" title="Back">←</button>
                <span id="reader-book-title" style="font-weight:600;font-size:0.85rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Reading...</span>
                <button class="btn btn-sm" id="btn-font-decrease" title="Decrease Font">A-</button>
                <button class="btn btn-sm" id="btn-font-increase" title="Increase Font">A+</button>
                <button class="btn btn-sm btn-icon" id="btn-bookmark" title="Bookmark Page">🔖</button>
                <button class="btn btn-sm btn-icon" id="btn-tts-toggle" title="Text-to-Speech">🔊</button>
                <button class="btn btn-sm btn-icon" id="btn-auto-scroll" title="Auto-Scroll">⏬</button>
                <span id="page-indicator" style="font-size:0.75rem;color:var(--text-tertiary);"></span>
            </div>
            <div class="reader-content" id="reader-content">
                <div id="epub-container" class="hidden"></div>
                <div id="pdf-container" class="hidden"></div>
                <div id="html-content-area" class="hidden" contenteditable="false"></div>
                <div id="cbz-container" class="hidden"></div>
            </div>
            <!-- TTS control bar -->
            <div class="tts-bar hidden" id="tts-bar">
                <button class="btn btn-sm btn-icon" id="btn-tts-play">▶️</button>
                <button class="btn btn-sm btn-icon" id="btn-tts-stop">⏹️</button>
                <label style="font-size:0.7rem;">Speed:</label>
                <input type="range" id="tts-speed" min="0.5" max="3" step="0.1" value="1" style="width:80px;">
                <span id="tts-speed-label" style="font-size:0.7rem;">1x</span>
                <label style="font-size:0.7rem;">Voice:</label>
                <select id="tts-voice-select" style="width:auto;font-size:0.7rem;"></select>
            </div>
        </div>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <!-- Sidebar (TOC / Settings) -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3 id="sidebar-title">⚙️ Settings</h3>
                <button class="btn btn-sm btn-icon btn-ghost" id="btn-sidebar-close">✕</button>
            </div>
            <div class="sidebar-body" id="sidebar-body"></div>
        </div>

        <!-- Search Popup -->
        <div class="search-popup" id="search-popup">
            <button class="btn btn-sm btn-icon btn-ghost" id="btn-search-close">✕</button>
            <input type="text" id="search-input" placeholder="Search in book...">
            <span class="search-results-count" id="search-count"></span>
            <button class="btn btn-sm" id="btn-search-prev">▲</button>
            <button class="btn btn-sm" id="btn-search-next">▼</button>
        </div>

        <!-- Highlight color picker (floating) -->
        <div class="highlight-modal hidden" id="highlight-modal">
            <button class="highlight-color-btn yellow" data-color="yellow" title="Yellow"></button>
            <button class="highlight-color-btn blue" data-color="blue" title="Blue"></button>
            <button class="highlight-color-btn green" data-color="green" title="Green"></button>
            <button class="highlight-color-btn pink" data-color="pink" title="Pink"></button>
            <button class="btn btn-sm" id="btn-add-note" title="Add Note">💬 Note</button>
            <button class="btn btn-sm btn-ghost" id="btn-define-word" title="Define / Translate">📖 Define</button>
        </div>

        <!-- Toast container -->
        <div id="toast-container"></div>
    </div>

    <!-- ==================== MAIN APPLICATION SCRIPT ==================== -->
    <script>
        (function() {
            // ==================== PDF.js WORKER CONFIGURATION ====================
            if (typeof pdfjsLib !== 'undefined') {
                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
            }

            // ==================== DOM ELEMENT REFERENCES ====================
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const appContainer = $('#app-container');
            const bookshelfView = $('#bookshelf-view');
            const readerView = $('#reader-view');
            const booksGrid = $('#books-grid');
            const emptyState = $('#empty-state');
            const navTitle = $('#nav-title');
            const btnBackLibrary = $('#btn-back-library');
            const btnSettings = $('#btn-settings');
            const btnToc = $('#btn-toc');
            const btnSearchToggle = $('#btn-search-toggle');
            const btnImmersive = $('#btn-immersive');
            const btnUpload = $('#btn-upload');
            const fileInput = $('#file-input');
            const btnEmptyUpload = $('#btn-empty-upload');
            const readerToolbar = $('#reader-toolbar');
            const readerBookTitle = $('#reader-book-title');
            const pageIndicator = $('#page-indicator');
            const epubContainer = $('#epub-container');
            const pdfContainer = $('#pdf-container');
            const htmlContentArea = $('#html-content-area');
            const cbzContainer = $('#cbz-container');
            const readerContent = $('#reader-content');
            const ttsBar = $('#tts-bar');
            const sidebar = $('#sidebar');
            const sidebarOverlay = $('#sidebar-overlay');
            const sidebarBody = $('#sidebar-body');
            const sidebarTitle = $('#sidebar-title');
            const searchPopup = $('#search-popup');
            const searchInput = $('#search-input');
            const searchCount = $('#search-count');
            const highlightModal = $('#highlight-modal');
            const toastContainer = $('#toast-container');
            const sortBtns = $$('.sort-btn');




            window.loadBookFromBase64 = async function(format, base64) {
                try {
                    const binaryString = atob(base64);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    const file = new File([bytes.buffer], "book." + format.toLowerCase(), { type: "application/octet-stream" });

                    // Add to DB directly and open it
                    const timestamp = Date.now();
                    const newBook = {
                        id: timestamp.toString(),
                        title: file.name.replace(/\.[^/.]+$/, ""),
                        format: format.toLowerCase(),
                        file: file,
                        coverUrl: null,
                        lastRead: timestamp,
                        progress: 0,
                        spinePos: null
                    };

                    await booksStore.setItem(newBook.id, newBook);

                    // Immediately open
                    await openBook(newBook.id);
                } catch (e) {
                    console.error("Failed to load book from base64:", e);
                    showToast("Failed to load book from Android");
                }
            };



            // ==================== APPLICATION STATE ==================== */

            const state = {
                currentView: 'bookshelf',
                currentBookId: null,
                currentBookData: null,
                currentFormat: null,
                sortMode: 'recent',
                theme: 'light',
                fontSize: 16,
                lineSpacing: 1.7,
                wordSpacing: 0,
                margins: 20,
                fontFamily: 'serif',
                isImmersive: false,
                isScrollMode: true,
                isTTSActive: false,
                ttsSpeed: 1,
                currentCFI: null,
                currentPage: 1,
                totalPages: 0,
                searchResults: [],
                searchIndex: 0,
                epubRendition: null,
                epubBook: null,
                pdfDoc: null,
                cbzImages: [],
                autoScrollInterval: null,
                autoScrollSpeed: 40,
                selectedText: '',
            };

            // ==================== INDEXEDDB SETUP VIA LOCALFORAGE ====================
            const booksStore = localforage.createInstance({ name: 'ebookReader', storeName: 'books' });
            const annotationsStore = localforage.createInstance({ name: 'ebookReader', storeName: 'annotations' });
            const bookmarksStore = localforage.createInstance({ name: 'ebookReader', storeName: 'bookmarks' });
            const settingsStore = localforage.createInstance({ name: 'ebookReader', storeName: 'settings' });

            // ==================== UTILITY FUNCTIONS ====================
            function generateId() {
                return 'book_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            function getFileExtension(filename) {
                return filename.split('.').pop().toLowerCase();
            }

            function getFormatFromExt(ext) {
                const map = {
                    'epub': 'EPUB',
                    'pdf': 'PDF',
                    'md': 'Markdown',
                    'txt': 'TXT',
                    'html': 'HTML',
                    'htm': 'HTML',
                    'cbz': 'CBZ',
                    'cbr': 'CBR',
                    'fb2': 'FB2'
                };
                return map[ext] || ext.toUpperCase();
            }

            function showToast(message, duration = 2000) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, duration + 400);
            }

            function showLoading(container) {
                const existing = container.querySelector('.loading-overlay');
                if (existing) return;
                const overlay = document.createElement('div');
                overlay.className = 'loading-overlay';
                overlay.innerHTML = '<div class="spinner"></div>';
                container.appendChild(overlay);
                return overlay;
            }

            function hideLoading(overlay) {
                if (overlay && overlay.parentNode) overlay.remove();
            }

            // ==================== THEME MANAGEMENT ====================
            function applyTheme(theme) {
                state.theme = theme;
                document.documentElement.setAttribute('data-theme', theme);
                settingsStore.setItem('theme', theme);
                $$('.theme-dot').forEach(dot => {
                    dot.classList.toggle('active', dot.dataset.theme === theme);
                });
            }

            function loadTheme() {
                settingsStore.getItem('theme').then(theme => {
                    applyTheme(theme || 'light');
                }).catch(() => applyTheme('light'));
            }

            // ==================== READER TYPOGRAPHY ====================
            function applyTypography() {
                const readerEl = htmlContentArea;
                readerEl.style.fontSize = state.fontSize + 'px';
                readerEl.style.lineHeight = state.lineSpacing;
                readerEl.style.wordSpacing = state.wordSpacing + 'px';
                readerEl.style.padding = state.margins + 'px';
                const fontMap = {
                    'serif': "'Georgia', 'Times New Roman', serif",
                    'sans-serif': "'Segoe UI', system-ui, -apple-system, sans-serif",
                    'monospace': "'JetBrains Mono', 'Fira Code', 'Consolas', monospace",
                    'opendyslexic': "'OpenDyslexic', 'OpenDyslexic Regular', sans-serif",
                };
                readerEl.style.fontFamily = fontMap[state.fontFamily] || fontMap['serif'];

                if (epubContainer && state.epubRendition) {
                    try {
                        state.epubRendition.themes.fontSize(state.fontSize + 'px');
                    } catch (e) {}
                }
            }

            // ==================== BOOKSHELF RENDERING ====================
            async function loadBookshelf() {
                const books = [];
                await booksStore.iterate((value, key) => {
                    books.push({ id: key, ...value });
                });

                const sortMode = state.sortMode;
                books.sort((a, b) => {
                    if (sortMode === 'recent') return (b.addedAt || 0) - (a.addedAt || 0);
                    if (sortMode === 'lastRead') return (b.lastReadAt || 0) - (a.lastReadAt || 0);
                    if (sortMode === 'title') return (a.title || '').localeCompare(b.title || '');
                    return 0;
                });

                renderBooksGrid(books);
                updateStorageInfo();
            }

            function renderBooksGrid(books) {
                booksGrid.innerHTML = '';
                if (books.length === 0) {
                    emptyState.classList.remove('hidden');
                    booksGrid.classList.add('hidden');
                    $('#storage-info').classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');
                booksGrid.classList.remove('hidden');
                $('#storage-info').classList.remove('hidden');

                books.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.setAttribute('data-book-id', book.id);
                    const progressPercent = book.totalPages > 0 ? Math.round((book.currentPage / book
                        .totalPages) * 100) : (book.progress || 0);
                    const coverHTML = book.coverDataUrl ?
                        `<img src="${book.coverDataUrl}" alt="Cover" loading="lazy">` :
                        `<span class="placeholder-icon">📖</span>`;

                    card.innerHTML = `
                <div class="book-cover">${coverHTML}</div>
                <div class="book-card-actions">
                  <button class="btn-icon btn-danger" data-action="delete" data-book-id="${book.id}" title="Delete">🗑️</button>
                </div>
                <div class="book-info">
                  <span class="book-format-badge">${book.format || 'UNKNOWN'}</span>
                  <span class="book-title">${escapeHTML(book.title || 'Untitled')}</span>
                  <span class="book-author">${escapeHTML(book.author || 'Unknown Author')}</span>
                  <div class="progress-bar-wrap">
                    <div class="progress-bar-fill" style="width:${progressPercent}%;"></div>
                  </div>
                  <span class="progress-label">${progressPercent}% read</span>
                </div>
              `;
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('[data-action="delete"]')) return;
                        openBook(book.id);
                    });
                    card.querySelector('[data-action="delete"]').addEventListener('click', async (e) => {
                        e.stopPropagation();
                        if (confirm(`Delete "${book.title}"? This cannot be undone.`)) {
                            await deleteBook(book.id);
                        }
                    });
                    booksGrid.appendChild(card);
                });
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            async function deleteBook(bookId) {
                await booksStore.removeItem(bookId);
                await annotationsStore.removeItem(bookId);
                await bookmarksStore.removeItem(bookId);
                showToast('Book deleted');
                loadBookshelf();
            }

            async function clearLibrary() {
                if (!confirm('Delete ALL books? This cannot be undone.')) return;
                await booksStore.clear();
                await annotationsStore.clear();
                await bookmarksStore.clear();
                showToast('Library cleared');
                loadBookshelf();
            }

            function updateStorageInfo() {
                if (navigator.storage && navigator.storage.estimate) {
                    navigator.storage.estimate().then(est => {
                        const used = est.usage || 0;
                        const quota = est.quota || 0;
                        const percent = quota > 0 ? Math.round((used / quota) * 100) : 0;
                        $('#storage-info').innerHTML =
                            `<small style="color:var(--text-tertiary);">📦 ${formatFileSize(used)} used of ${formatFileSize(quota)} (${percent}%) · Offline-ready</small>`;
                    }).catch(() => {});
                }
            }

            // ==================== BOOK UPLOAD & STORAGE ====================
            async function handleFileUpload(files) {
                for (const file of files) {
                    try {
                        const ext = getFileExtension(file.name);
                        const format = getFormatFromExt(ext);
                        const bookId = generateId();
                        const arrayBuffer = await file.arrayBuffer();
                        let coverDataUrl = null;
                        let author = 'Unknown Author';
                        let title = file.name.replace(/\.[^.]+$/, '');

                        if (ext === 'epub') {
                            try {
                                const coverInfo = await extractEPUBCover(arrayBuffer.slice(0));
                                if (coverInfo.cover) coverDataUrl = coverInfo.cover;
                                if (coverInfo.title) title = coverInfo.title;
                                if (coverInfo.author) author = coverInfo.author;
                            } catch (e) { console.warn("Cover extraction failed", e); }
                        } else if (ext === 'cbz' || ext === 'cbr') {
                            try {
                                coverDataUrl = await extractCBZFirstImage(arrayBuffer.slice(0));
                            } catch (e) { console.warn("CBZ Cover extraction failed", e); }
                        } else if (ext === 'pdf') {
                            try {
                                coverDataUrl = await extractPDFFirstPage(arrayBuffer);
                            } catch (e) { console.warn("PDF Cover extraction failed", e); }
                        }

                        const bookData = {
                            title: title,
                            author: author,
                            format: format,
                            fileData: arrayBuffer,
                            fileName: file.name,
                            fileSize: file.size,
                            coverDataUrl: coverDataUrl,
                            addedAt: Date.now(),
                            lastReadAt: null,
                            currentPage: 1,
                            totalPages: 0,
                            progress: 0,
                            cfi: null,
                        };

                        await booksStore.setItem(bookId, bookData);
                        showToast(`Added: ${title}`);
                    } catch (error) {
                        console.error("Error loading file", file.name, error);
                        showToast(`Error adding ${file.name}`);
                    }
                }
                loadBookshelf();
            }

            async function extractEPUBCover(arrayBuffer) {
                const zip = await JSZip.loadAsync(arrayBuffer);
                let cover = null;
                let title = null;
                let author = null;

                const coverFiles = Object.keys(zip.files).filter(name =>
                    /cover\.(jpg|jpeg|png|webp|gif)/i.test(name) ||
                    /\/cover\.(jpg|jpeg|png|webp|gif)/i.test(name)
                );
                if (coverFiles.length > 0) {
                    const coverFile = zip.files[coverFiles[0]];
                    const blob = await coverFile.async('blob');
                    cover = await blobToDataURL(blob);
                }

                const opfFile = Object.keys(zip.files).find(name => name.endsWith('.opf'));
                if (opfFile && zip.files[opfFile]) {
                    const opfText = await zip.files[opfFile].async('text');
                    const titleMatch = opfText.match(/<dc:title[^>]*>([^<]+)<\/dc:title>/i);
                    const authorMatch = opfText.match(/<dc:creator[^>]*>([^<]+)<\/dc:creator>/i);
                    if (titleMatch) title = titleMatch[1].trim();
                    if (authorMatch) author = authorMatch[1].trim();
                }

                return { cover, title, author };
            }

            async function extractCBZFirstImage(arrayBuffer) {
                const zip = await JSZip.loadAsync(arrayBuffer);
                const imageFiles = Object.keys(zip.files).filter(name =>
                    /\.(jpg|jpeg|png|webp|gif|bmp)/i.test(name)
                ).sort();
                if (imageFiles.length > 0) {
                    const blob = await zip.files[imageFiles[0]].async('blob');
                    return await blobToDataURL(blob);
                }
                return null;
            }

            async function extractPDFFirstPage(arrayBuffer) {
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
                if (pdf.numPages > 0) {
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({ scale: 0.3 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    const ctx = canvas.getContext('2d');
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    return canvas.toDataURL('image/jpeg', 0.7);
                }
                return null;
            }

            function blobToDataURL(blob) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            }

            // ==================== OPEN BOOK / READER ====================

                state.totalPages = bookData.totalPages || 0;

                        await renderTextContent(bookData);
                    } else if (format === 'CBZ' || format === 'CBR') {
                        await renderCBZ(bookData.fileData);
                    } else {
                        await renderTextContent(bookData);

                } catch (err) {

                    showToast('Error loading book. Format may be unsupported.');

                updateReaderUIForFormat();
                loadBookmarksForCurrentBook();

            // ==================== EPUB RENDERING ====================
            async function renderEPUB(arrayBuffer) {
                epubContainer.classList.remove('hidden');

                const book = ePub(arrayBuffer);
                state.epubBook = book;
                const rendition = book.renderTo(epubContainer, {
                    width: '100%',
                    height: '100%',
                    spread: 'none',
                    flow: state.isScrollMode ? 'scrolled-doc' : 'paginated',
                    manager: 'default',
                });
                state.epubRendition = rendition;

                if (state.currentCFI) {
                    try {
                        await rendition.display(state.currentCFI);
                    } catch (e) {
                        await rendition.display();
                    }
                } else {
                    await rendition.display();
                }

                state.currentPage = 1;
                pageIndicator.textContent = 'Loading pages...';

                book.ready.then(() => {
                    return book.locations.generate(1000);
                }).then(() => {
                    state.totalPages = book.locations.total || 0;
                    pageIndicator.textContent = state.totalPages > 0 ?
                        `Page ${state.currentPage} / ${state.totalPages}` : '';
                }).catch(e => console.warn('Error generating locations', e));

                rendition.on('relocated', (location) => {
                    if (location.start && location.start.cfi) {
                        state.currentCFI = location.start.cfi;
                    }
                    if (book.locations && book.locations.locationFromCfi) {
                        const loc = book.locations.locationFromCfi(location.start.cfi);
                        if (loc !== null && loc !== undefined) {
                            state.currentPage = Math.round(loc) + 1;
                            pageIndicator.textContent =
                                `Page ${state.currentPage} / ${state.totalPages || '?'}`;
                            saveReadingProgress();
                        }
                    }
                });

                buildEPUBTOC(book);
                epubContainer.classList.toggle('epub-scroll', state.isScrollMode);
            }

            async function buildEPUBTOC(book) {
                try {
                    const toc = await book.loaded.navigation;
                    if (toc && toc.toc && toc.toc.length > 0) {
                        state._epubTOC = toc.toc;
                    } else {
                        state._epubTOC = [];
                    }
                } catch (e) {
                    state._epubTOC = [];
                }
            }

            // ==================== PDF RENDERING ====================
            async function renderPDF(arrayBuffer) {
                pdfContainer.classList.remove('hidden');
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
                state.pdfDoc = pdf;
                state.totalPages = pdf.numPages;
                state.currentPage = Math.min(state.currentPage, state.totalPages) || 1;

                await renderPDFPage(state.currentPage);
                pageIndicator.textContent = `Page ${state.currentPage} / ${state.totalPages}`;
            }

            async function renderPDFPage(pageNum) {
                if (!state.pdfDoc) return;
                pdfContainer.innerHTML = '';
                const page = await state.pdfDoc.getPage(pageNum);
                const containerWidth = pdfContainer.clientWidth - 32;
                const scale = Math.min(containerWidth / page.getViewport({ scale: 1 }).width, 2.5);
                const viewport = page.getViewport({ scale });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.style.maxWidth = '100%';
                canvas.style.height = 'auto';
                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport }).promise;
                pdfContainer.appendChild(canvas);
                state.currentPage = pageNum;
                pageIndicator.textContent = `Page ${pageNum} / ${state.totalPages}`;
                saveReadingProgress();
            }

            function nextPDFPage() {
                if (state.currentPage < state.totalPages) {
                    renderPDFPage(state.currentPage + 1);
                }
            }

            function prevPDFPage() {
                if (state.currentPage > 1) {
                    renderPDFPage(state.currentPage - 1);
                }
            }

            // ==================== TEXT CONTENT RENDERING ====================
            async function renderTextContent(bookData) {
                htmlContentArea.classList.remove('hidden');
                let text = '';
                const format = bookData.format;
                const arrayBuffer = bookData.fileData;
                const decoder = new TextDecoder('utf-8');
                let rawText = decoder.decode(new Uint8Array(arrayBuffer));

                if (format === 'Markdown') {
                    text = marked.parse(rawText);
                } else if (format === 'FB2') {
                    text = parseFB2(rawText);
                } else if (format === 'HTML') {
                    text = rawText;
                } else {
                    text = '<pre style="white-space:pre-wrap;font-family:inherit;">' + escapeHTML(rawText) + '</pre>';
                }
                htmlContentArea.innerHTML = text;
                htmlContentArea.scrollTop = 0;
                state.totalPages = Math.ceil(htmlContentArea.scrollHeight / (htmlContentArea.clientHeight || 600));
                state.currentPage = 1;
                pageIndicator.textContent = `Scroll · ~${state.totalPages} screens`;
                applyTypography();

                htmlContentArea.onscroll = () => {
                    const scrollTop = htmlContentArea.scrollTop;
                    const scrollHeight = htmlContentArea.scrollHeight - htmlContentArea.clientHeight;
                    if (scrollHeight > 0) {
                        const progress = Math.round((scrollTop / scrollHeight) * 100);
                        state.currentPage = Math.floor(scrollTop / (htmlContentArea.clientHeight || 600)) + 1;
                        state.totalPages = Math.ceil(scrollHeight / (htmlContentArea.clientHeight || 600)) + 1;
                        pageIndicator.textContent = `Scroll · ${progress}% · Screen ${state.currentPage}/${state.totalPages}`;
                        saveReadingProgress();
                    }
                };
            }

            function parseFB2(xmlText) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(xmlText, 'application/xml');
                const bodies = doc.querySelectorAll('body');
                let html = '<div class="fb2-content">';
                bodies.forEach(body => {
                    const sections = body.querySelectorAll('section');
                    sections.forEach(section => {
                        const title = section.querySelector('title');
                        if (title) html += `<h2>${title.textContent}</h2>`;
                        const paragraphs = section.querySelectorAll('p');
                        paragraphs.forEach(p => html += `<p>${p.textContent}</p>`);
                    });
                    const directPs = body.querySelectorAll(':scope > p');
                    directPs.forEach(p => html += `<p>${p.textContent}</p>`);
                });
                html += '</div>';
                return html || '<p>(Empty FB2 document)</p>';
            }

            // ==================== CBZ RENDERING ====================
            async function renderCBZ(arrayBuffer) {
                cbzContainer.classList.remove('hidden');
                const zip = await JSZip.loadAsync(arrayBuffer);
                const imageFiles = Object.keys(zip.files).filter(name =>
                    /\.(jpg|jpeg|png|webp|gif|bmp)/i.test(name)
                ).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

                if (imageFiles.length === 0) {
                    cbzContainer.innerHTML = '<p style="text-align:center;padding:2rem;">No images found in CBZ file.</p>';
                    return;
                }
                state.cbzImages = [];
                state.totalPages = imageFiles.length;
                state.currentPage = Math.min(state.currentPage, state.totalPages) || 1;

                for (const imgName of imageFiles) {
                    const blob = await zip.files[imgName].async('blob');
                    const dataUrl = await blobToDataURL(blob);
                    state.cbzImages.push({ name: imgName, dataUrl });
                }

                renderCBZPage(state.currentPage);
                pageIndicator.textContent = `Page ${state.currentPage} / ${state.totalPages}`;
            }

            function renderCBZPage(pageNum) {
                if (!state.cbzImages.length) return;
                const idx = Math.max(0, Math.min(pageNum - 1, state.cbzImages.length - 1));
                cbzContainer.innerHTML = '';
                const img = document.createElement('img');
                img.src = state.cbzImages[idx].dataUrl;
                img.alt = state.cbzImages[idx].name;
                img.loading = 'lazy';
                cbzContainer.appendChild(img);
                state.currentPage = idx + 1;
                pageIndicator.textContent = `Page ${idx + 1} / ${state.totalPages}`;
                saveReadingProgress();
            }

            function nextCBZPage() {
                if (state.currentPage < state.totalPages) {
                    renderCBZPage(state.currentPage + 1);
                    cbzContainer.scrollTop = 0;
                }
            }

            function prevCBZPage() {
                if (state.currentPage > 1) {
                    renderCBZPage(state.currentPage - 1);
                    cbzContainer.scrollTop = 0;
                }
            }

            // ==================== READING PROGRESS ====================
            async function saveReadingProgress() {
                if (!state.currentBookId || !state.currentBookData) return;
                const bookData = state.currentBookData;
                bookData.currentPage = state.currentPage;
                bookData.totalPages = state.totalPages;
                bookData.cfi = state.currentCFI;
                bookData.progress = state.totalPages > 0 ? Math.round((state.currentPage / state.totalPages) * 100) : 0;
                bookData.lastReadAt = Date.now();
                await booksStore.setItem(state.currentBookId, bookData);
            }

            // ==================== BOOKMARKS ====================

            // ==================== HIGHLIGHTING & ANNOTATIONS ====================
            function getSelectedText() {
                return window.getSelection().toString().trim();
            }

            function showHighlightModal(x, y) {
                const text = getSelectedText();
                if (!text || text.length < 2) {
                    highlightModal.classList.add('hidden');
                    return;
                }
                state.selectedText = text;
                highlightModal.style.top = Math.min(y + 10, window.innerHeight - 120) + 'px';
                highlightModal.style.left = Math.min(x, window.innerWidth - 220) + 'px';
                highlightModal.classList.remove('hidden');
            }

            function hideHighlightModal() {
                highlightModal.classList.add('hidden');
                state.selectedText = '';
            }

            async function addHighlight(color) {
                const text = state.selectedText;
                if (!text || !state.currentBookId) return;
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                const range = selection.getRangeAt(0);

                const span = document.createElement('span');
                span.style.backgroundColor = getHighlightColorCSS(color);
                span.style.borderRadius = '2px';
                span.style.cursor = 'pointer';
                span.dataset.highlightColor = color;
                span.dataset.highlightId = 'hl_' + Date.now();
                try {
                    range.surroundContents(span);
                } catch (e) {
                    showToast('Could not highlight this selection');
                    hideHighlightModal();
                    return;
                }

                const annotation = {
                    id: span.dataset.highlightId,
                    bookId: state.currentBookId,
                    text: text,
                    color: color,
                    page: state.currentPage,
                    cfi: state.currentCFI,
                    note: '',
                    createdAt: Date.now(),
                };
                const existing = await annotationsStore.getItem(state.currentBookId) || [];
                existing.push(annotation);
                await annotationsStore.setItem(state.currentBookId, existing);
                showToast('✨ Highlighted!');
                hideHighlightModal();
                window.getSelection().removeAllRanges();
            }

            async function addNoteToHighlight() {
                const text = state.selectedText;
                if (!text) return;
                const note = prompt('Add a note for this highlight:', '');
                if (note === null) return;

                const annotation = {
                    id: 'hl_' + Date.now(),
                    bookId: state.currentBookId,
                    text: text,
                    color: 'yellow',
                    page: state.currentPage,
                    cfi: state.currentCFI,
                    note: note,
                    createdAt: Date.now(),
                };
                const existing = await annotationsStore.getItem(state.currentBookId) || [];
                existing.push(annotation);
                await annotationsStore.setItem(state.currentBookId, existing);
                showToast('📝 Note saved!');
                hideHighlightModal();
                window.getSelection().removeAllRanges();
            }

            function getHighlightColorCSS(color) {
                const map = {
                    'yellow': 'rgba(255,230,100,0.5)',
                    'blue': 'rgba(100,180,255,0.5)',
                    'green': 'rgba(100,255,150,0.5)',
                    'pink': 'rgba(255,150,200,0.5)',
                };
                return map[color] || map['yellow'];
            }

            async function defineWord() {

                if (!text) return;
                const word = text.trim().split(/\s+/)[0].toLowerCase();
