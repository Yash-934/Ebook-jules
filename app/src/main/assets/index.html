            // ==================== TEXT-TO-SPEECH (TTS) ====================
            function initTTS() {
                if (!('speechSynthesis' in window)) {
                    showToast('Text-to-Speech not supported in this browser');
                    return;
                }
                ttsBar.classList.remove('hidden');
                populateVoices();
                speechSynthesis.onvoiceschanged = populateVoices;
            }

            function populateVoices() {
                const voices = speechSynthesis.getVoices();
                const select = $('#tts-voice-select');
                select.innerHTML = '';
                voices.forEach((voice, i) => {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    select.appendChild(option);
                });
                if (voices.length > 0 && select.options.length > 0) {
                    const enIdx = voices.findIndex(v => v.lang.startsWith('en'));
                    select.selectedIndex = enIdx >= 0 ? enIdx : 0;
                }
            }

            function startTTS() {
                if (!('speechSynthesis' in window)) return;
                stopTTS();
                const text = getReaderTextContent();
                if (!text || text.length < 5) {
                    showToast('No text to read');
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(text);
                const voices = speechSynthesis.getVoices();
                const voiceIdx = parseInt($('#tts-voice-select').value);
                if (voices[voiceIdx]) utterance.voice = voices[voiceIdx];
                utterance.rate = state.ttsSpeed;
                utterance.pitch = 1;
                utterance.volume = 1;
                utterance.onend = () => {
                    state.isTTSActive = false;
                    $('#btn-tts-play').textContent = '▶️';
                };
                utterance.onerror = () => {
                    state.isTTSActive = false;
                    $('#btn-tts-play').textContent = '▶️';
                };
                state._ttsUtterance = utterance;
                speechSynthesis.speak(utterance);
                state.isTTSActive = true;
                $('#btn-tts-play').textContent = '⏸️';
                ttsBar.classList.remove('hidden');
            }

            function pauseTTS() {
                if (speechSynthesis.speaking) {
                    speechSynthesis.pause();
                    state.isTTSActive = false;
                    $('#btn-tts-play').textContent = '▶️';
                }
            }

            function resumeTTS() {
                if (speechSynthesis.paused) {
                    speechSynthesis.resume();
                    state.isTTSActive = true;
                    $('#btn-tts-play').textContent = '⏸️';
                }
            }

            function stopTTS() {
                speechSynthesis.cancel();
                state.isTTSActive = false;
                state._ttsUtterance = null;
                $('#btn-tts-play').textContent = '▶️';
            }

            function getReaderTextContent() {
                if (state.currentFormat === 'EPUB' && state.epubRendition) {
                    const container = epubContainer;
                    if (container) return container.textContent || '';
                }
                if (state.currentFormat === 'PDF') {
                    return pdfContainer.textContent || '';
                }
                return htmlContentArea.textContent || '';
            }

            // ==================== AUTO-SCROLL ====================
            function toggleAutoScroll() {
                if (state.autoScrollInterval) {
                    stopAutoScroll();
                    showToast('Auto-scroll stopped');
                } else {
                    startAutoScroll();
                    showToast('Auto-scroll started');
                }
            }

            function startAutoScroll() {
                stopAutoScroll();
                state.autoScrollInterval = setInterval(() => {
                    const container = getActiveScrollContainer();
                    if (container) {
                        container.scrollTop += state.autoScrollSpeed / 30;
                        if (container.scrollTop >= container.scrollHeight - container.clientHeight - 5) {
                            stopAutoScroll();
                            showToast('Reached end');
                        }
                    }
                }, 33);
                $('#btn-auto-scroll').textContent = '⏹️';
            }

            function stopAutoScroll() {
                if (state.autoScrollInterval) {
                    clearInterval(state.autoScrollInterval);
                    state.autoScrollInterval = null;
                }
                $('#btn-auto-scroll').textContent = '⏬';
            }

            function getActiveScrollContainer() {
                if (!epubContainer.classList.contains('hidden') && state.isScrollMode) return epubContainer;
                if (!pdfContainer.classList.contains('hidden')) return pdfContainer;
                if (!htmlContentArea.classList.contains('hidden')) return htmlContentArea;

            // ==================== IN-BOOK SEARCH ====================
            function openSearch() {
                searchPopup.classList.add('active');
                searchInput.focus();
                searchInput.value = '';
                searchCount.textContent = '';
                state.searchResults = [];
                state.searchIndex = 0;
            }

            function closeSearch() {
                searchPopup.classList.remove('active');
                clearSearchHighlights();
            }

            function performSearch(query) {
                clearSearchHighlights();
                if (!query || query.length < 2) {
                    searchCount.textContent = '';
                    state.searchResults = [];
                    return;
                }
                const container = getActiveTextContainer();
                if (!container) return;
                const text = container.textContent || '';
                const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                state.searchResults = [];

                let match;
                while ((match = regex.exec(text)) !== null) {
                    state.searchResults.push({ index: match.index, text: match[0] });
                }
                if (state.searchResults.length > 0) {
                    searchCount.textContent = `1 / ${state.searchResults.length}`;
                    state.searchIndex = 0;
                    highlightSearchResult(0);
                } else {
                    searchCount.textContent = '0 results';
                }
            }

            function highlightSearchResult(idx) {
                if (!state.searchResults.length) return;
                const container = getActiveTextContainer();
                if (!container) return;
                clearSearchHighlights();
                const result = state.searchResults[idx];

                const textLength = (container.textContent || '').length;
                if (textLength > 0) {
                    const ratio = result.index / textLength;
                    container.scrollTop = ratio * (container.scrollHeight - container.clientHeight);
                }
                searchCount.textContent = `${idx + 1} / ${state.searchResults.length}`;
                state.searchIndex = idx;

                try {
                    const textNode = findTextNodeAtPosition(container, result.index, result.text.length);
                    if (textNode && textNode.parentNode) {
                        const range = document.createRange();
                        range.setStart(textNode, 0);
                        range.setEnd(textNode, Math.min(result.text.length, textNode.length));
                        const span = document.createElement('span');
                        span.className = 'search-highlight-temp';
                        span.style.backgroundColor = 'rgba(255,165,0,0.6)';
                        span.style.borderRadius = '2px';
                        range.surroundContents(span);
                    }
                } catch (e) {}
            }

            function findTextNodeAtPosition(container, targetIndex, length) {
                const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
                let currentIndex = 0;
                let node;
                while ((node = walker.nextNode())) {
                    const nodeLen = node.length;
                    if (currentIndex + nodeLen > targetIndex) {
                        return node;
                    }
                    currentIndex += nodeLen;
                }
                return null;
            }

            function clearSearchHighlights() {
                $$('.search-highlight-temp').forEach(el => {
                    const parent = el.parentNode;
                    if (parent) {
                        while (el.firstChild) parent.insertBefore(el.firstChild, el);
                        parent.removeChild(el);
                        parent.normalize();
                    }
                });
            }

            function getActiveTextContainer() {
                if (!epubContainer.classList.contains('hidden')) return epubContainer;
                if (!htmlContentArea.classList.contains('hidden')) return htmlContentArea;
                if (!pdfContainer.classList.contains('hidden')) return pdfContainer;
                return null;
            }

            function nextSearchResult() {
                if (!state.searchResults.length) return;
                state.searchIndex = (state.searchIndex + 1) % state.searchResults.length;
                highlightSearchResult(state.searchIndex);
            }

            function prevSearchResult() {
                if (!state.searchResults.length) return;
                state.searchIndex = (state.searchIndex - 1 + state.searchResults.length) % state.searchResults.length;
                highlightSearchResult(state.searchIndex);
            }

            // ==================== EXPORT / IMPORT ====================
            async function exportData() {
                const allAnnotations = {};
                await annotationsStore.iterate((val, key) => { allAnnotations[key] = val; });
                const allBookmarks = {};
                await bookmarksStore.iterate((val, key) => { allBookmarks[key] = val; });
                const allBooks = {};
                await booksStore.iterate((val, key) => {
                    const { fileData, ...meta } = val;
                    allBooks[key] = meta;
                });
                const exportObj = {
                    version: '1.0',
                    exportedAt: Date.now(),
                    annotations: allBookmarks,
                    bookmarks: allBookmarks,
                    bookMeta: allBooks,
                };
                const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ebook-reader-backup-' + new Date().toISOString().slice(0, 10) + '.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast('📤 Data exported!');
                closeSidebar();
            }

            async function importData(file) {
                if (!file) return;
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    if (data.annotations) {
                        for (const [key, val] of Object.entries(data.annotations)) {
                            await annotationsStore.setItem(key, val);
                        }
                    }
                    if (data.bookmarks) {
                        for (const [key, val] of Object.entries(data.bookmarks)) {
                            await bookmarksStore.setItem(key, val);
                        }
                    }
                    if (data.bookMeta) {
                        for (const [key, val] of Object.entries(data.bookMeta)) {
                            const existing = await booksStore.getItem(key);
                            if (existing) {
                                await booksStore.setItem(key, { ...existing, ...val });
                            }
                        }
                    }
                    showToast('📥 Data imported!');
                    loadBookshelf();
                } catch (e) {
                    showToast('Invalid backup file');
                }
                closeSidebar();
            }

            // ==================== IMMERSIVE MODE ====================
            function toggleImmersive() {
                state.isImmersive = !state.isImmersive;
                if (state.isImmersive) {
                    document.body.classList.add('immersive-mode');
                    readerToolbar.classList.add('immersive-hidden');
                    ttsBar.classList.add('immersive-hidden');
                    document.body.requestFullscreen?.().catch(() => {});
                    showToast('Immersive mode · Tap top/bottom to show controls');
                } else {
                    document.body.classList.remove('immersive-mode');
                    readerToolbar.classList.remove('immersive-hidden');
                    ttsBar.classList.remove('immersive-hidden');
                    if (document.fullscreenElement) document.exitFullscreen?.();
                }
            }

            // ==================== KEYBOARD SHORTCUTS ====================
            function handleKeyboardShortcuts(e) {
                if (state.currentView !== 'reader') return;
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;

                switch (e.key) {
                    case 'ArrowRight':
                        e.preventDefault();
                        navigateNext();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        navigatePrev();
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        scrollDown();
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        scrollUp();
                        break;
                    case ' ':
                        e.preventDefault();
                        scrollDown();
                        break;
                    case 'Escape':
                        e.preventDefault();
                        if (state.isImmersive) toggleImmersive();
                        else if (searchPopup.classList.contains('active')) closeSearch();
                        else if (sidebar.classList.contains('active')) closeSidebar();
                        else switchToBookshelfView();
                        break;
                    case 'f':
                        if (e.ctrlKey || e.metaKey) {
                            e.preventDefault();
                            openSearch();
                        }
                        break;
                    case 'b':
                        if (e.ctrlKey || e.metaKey) {
                            e.preventDefault();
                            addBookmark();
                        }
                        break;
                    case 't':
                        if (e.ctrlKey || e.metaKey) {
                            e.preventDefault();
                            toggleImmersive();
                        }
                        break;
                }
            }

            function navigateNext() {
                if (state.currentFormat === 'PDF') nextPDFPage();
                else if (state.currentFormat === 'CBZ') nextCBZPage();
                else if (state.currentFormat === 'EPUB' && state.epubRendition && !state.isScrollMode) {
                    state.epubRendition.next();
                } else {
                    scrollDown();
                }
            }

            function navigatePrev() {
                if (state.currentFormat === 'PDF') prevPDFPage();
                else if (state.currentFormat === 'CBZ') prevCBZPage();
                else if (state.currentFormat === 'EPUB' && state.epubRendition && !state.isScrollMode) {
                    state.epubRendition.prev();
                } else {
                    scrollUp();
                }
            }

            function scrollDown() {
                const container = getActiveScrollContainer();
                if (container) container.scrollTop += (container.clientHeight || 400) * 0.8;
            }

            function scrollUp() {
                const container = getActiveScrollContainer();
                if (container) container.scrollTop -= (container.clientHeight || 400) * 0.8;
            }

                    hideHighlightModal();

            let touchStartX = 0;
            let touchStartY = 0;
            readerContent.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
            }, { passive: true });
            readerContent.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1 && state.currentView === 'reader') {
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    const dy = e.changedTouches[0].clientY - touchStartY;

            });

            // ==================== PWA SERVICE WORKER REGISTRATION ====================
            function registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    const swCode = `
                const CACHE_NAME = 'ebook-reader-v2';
                const ASSETS = [
                  '/',
                  self.location.href,
                ];
                self.addEventListener('install', (event) => {
                  event.waitUntil(
                    caches.open(CACHE_NAME).then((cache) => {
                      return cache.addAll(ASSETS).catch(() => {});
                    })
                  );
                  self.skipWaiting();
                });
                self.addEventListener('activate', (event) => {
                  event.waitUntil(
                    caches.keys().then((keys) => {
                      return Promise.all(
                        keys.filter((key) => key !== CACHE_NAME).map((key) => caches.delete(key))
                      );
                    })
                  );
                  self.clients.claim();
                });
                self.addEventListener('fetch', (event) => {
                  if (event.request.method !== 'GET') return;
                  event.respondWith(
                    caches.match(event.request).then((cached) => {
                      return cached || fetch(event.request).then((response) => {
                        if (response && response.status === 200) {
                          const clone = response.clone();
                          caches.open(CACHE_NAME).then((cache) => {
                            cache.put(event.request, clone);
                          });
                        }
                        return response;
                      }).catch(() => {
                        return cached || new Response('Offline - Resource not available', { status: 503 });
                      });
                    })
                  );
                });
              `;
                    const blob = new Blob([swCode], { type: 'application/javascript' });
                    const swUrl = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(swUrl, { scope: '/' }).then(reg => {
                        console.log('📦 Service Worker registered:', reg.scope);
                    }).catch(err => {
                        console.warn('Service Worker registration failed:', err.message);
                    });
                }
            }

            // ==================== PWA MANIFEST ====================
            function injectManifest() {
                const manifest = {
                    name: 'Ultimate eBook Reader',
                    short_name: 'eBook Reader',
                    description: 'Advanced offline eBook reader supporting EPUB, PDF, Markdown, TXT, HTML, CBZ, FB2',
                    start_url: window.location.href.split('?')[0],
                    display: 'standalone',
                    background_color: '#1a1a2e',
                    theme_color: '#6366f1',
                    orientation: 'any',
                    icons: [{
                        src: 'data:image/svg+xml,' + encodeURIComponent(
                            '<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192"><rect width="192" height="192" rx="32" fill="#6366f1"/><text x="96" y="120" font-size="90" text-anchor="middle" fill="white">📚</text></svg>'
                            ),
                        sizes: '192x192',
                        type: 'image/svg+xml',
                        purpose: 'any maskable'
                    }]
                };
                const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
                const link = document.createElement('link');
                link.rel = 'manifest';
                link.href = URL.createObjectURL(blob);
                document.head.appendChild(link);
            }

            // ==================== LOAD SAVED SETTINGS ====================
            async function loadSavedSettings() {
                try {
                    const theme = await settingsStore.getItem('theme');
                    if (theme) applyTheme(theme);
                    const fontSize = await settingsStore.getItem('fontSize');
                    if (fontSize) state.fontSize = fontSize;
                    const lineSpacing = await settingsStore.getItem('lineSpacing');
                    if (lineSpacing) state.lineSpacing = lineSpacing;
                    const wordSpacing = await settingsStore.getItem('wordSpacing');
                    if (wordSpacing !== null && wordSpacing !== undefined) state.wordSpacing = wordSpacing;
                    const margins = await settingsStore.getItem('margins');
                    if (margins) state.margins = margins;
                    const fontFamily = await settingsStore.getItem('fontFamily');
                    if (fontFamily) state.fontFamily = fontFamily;
                    const isScrollMode = await settingsStore.getItem('isScrollMode');
                    if (isScrollMode !== null && isScrollMode !== undefined) state.isScrollMode = isScrollMode;
                    const sortMode = await settingsStore.getItem('sortMode');
                    if (sortMode) {
                        state.sortMode = sortMode;
                        sortBtns.forEach(b => b.classList.toggle('active', b.dataset.sort === sortMode));
                    }
                } catch (e) {
                    console.warn('Could not load all settings:', e);
                }
                applyTypography();
            }

            // ==================== INITIALIZATION ====================
            async function init() {
                injectManifest();
                registerServiceWorker();
                await loadSavedSettings();
                await loadBookshelf();
                updateStorageInfo();
                console.log('📚 Ultimate eBook Reader initialized!');
            }

            init().catch(err => {
                console.error('Initialization error:', err);
                showToast('Error initializing app. Please refresh.');
            });

        })();
    </script>
</body>
</html>
